name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build bose-ultra-tuner and verify CLI
        run: |
          set -euo pipefail
          make clean
          make CFLAGS="-fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -O2"
          ./bose-ultra-tuner --help

      - name: Validate scripts and property lists
        run: |
          set -euo pipefail
          bash -n bose-ultra-wizard.sh
          python3 -m py_compile parse_appuhdr5.py
          while IFS= read -r -d '' plist; do
            plutil -lint "$plist"
          done < <(git ls-files -z '*.plist')
