name: Autonomous PR Review & Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: autonomous-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-and-approve:
    name: Autonomous Spec, Legal, OPSEC & Build Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run 4-Gate Autonomous PR Audit & Post GitHub Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          OPSEC_BLOCKLIST_REGEX: ${{ secrets.OPSEC_BLOCKLIST_REGEX }}
        run: |
          set -euo pipefail
          FAILURES=()

          # Gate 1: OPSEC & Zero-PII Check on working tree
          GENERIC_SECRET_REGEX='(BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|/Users/[a-zA-Z0-9._-]+/)'
          GENERIC_HITS=$( { grep -rnI -E -- "${GENERIC_SECRET_REGEX}" . --exclude-dir=.git --exclude=".git" --exclude="autonomous-pr-review.yml" --exclude="reusable-autonomous-pr-review.yml" || true; } | cut -d: -f1,2 )
          if [[ -n "${GENERIC_HITS}" ]]; then
            echo "Gate 1 generic secret/path match at:"
            echo "${GENERIC_HITS}"
            FAILURES+=("Gate 1 (OPSEC/PII): Secret or local home path pattern detected in repository tree.")
          fi
          if [[ -n "${OPSEC_BLOCKLIST_REGEX:-}" ]]; then
            BLOCKLIST_HITS=$( { grep -rnI -iE -- "${OPSEC_BLOCKLIST_REGEX}" . --exclude-dir=.git --exclude=".git" --exclude="autonomous-pr-review.yml" --exclude="reusable-autonomous-pr-review.yml" || true; } | cut -d: -f1,2 )
            if [[ -n "${BLOCKLIST_HITS}" ]]; then
              echo "Gate 1 OPSEC blocklist match at:"
              echo "${BLOCKLIST_HITS}"
              FAILURES+=("Gate 1 (OPSEC/PII): Forbidden identifier detected in repository tree.")
            fi
          fi

          # Gate 2: Cryptographic Commit Signature Verification
          UNVERIFIED=$(gh api --paginate "repos/${BASE_REPO}/pulls/${PR_NUMBER}/commits" --jq '[.[] | select(.commit.verification.verified != true)] | length')
          if [[ "${UNVERIFIED}" != "0" ]]; then
            FAILURES+=("Gate 2 (Signatures): ${UNVERIFIED} commit(s) in PR lack a verified cryptographic signature.")
          fi

          # Gate 3: Legal, Governance, Autonomous Spec Integrity & Inline Review Threads
          for req_file in LEGAL.md LICENSE SECURITY.md CODE_OF_CONDUCT.md .github/CODEOWNERS AGENTS.md CLAUDE.md docs/agents/autonomous-pipeline.md; do
            if [[ ! -s "${req_file}" ]]; then
              FAILURES+=("Gate 3 (Spec/Legal): Required file ${req_file} is missing or empty.")
            fi
          done
          if ! grep -q "Addendum: German Statutory References" LEGAL.md; then
            FAILURES+=("Gate 3 (Legal Addendum): LEGAL.md is missing the German Statutory References Addendum.")
          fi
          # Query repository.pullRequest.reviewThreads(first: 100) { nodes { isResolved } }
          REPO_OWNER="${BASE_REPO%%/*}"
          REPO_NAME="${BASE_REPO#*/}"
          UNRESOLVED_THREADS=$(gh api graphql \
            -F owner="${REPO_OWNER}" \
            -F name="${REPO_NAME}" \
            -F pr="${PR_NUMBER}" \
            -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { reviewThreads(first: 100) { nodes { isResolved } } } } }' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          if [[ "${UNRESOLVED_THREADS}" != "0" ]]; then
            FAILURES+=("Gate 3 (Review Threads): ${UNRESOLVED_THREADS} inline review thread(s) have isResolved == false.")
          fi

          # Gate 4: Project Syntax & Verification Gate
          if [[ -f "parse_appuhdr5.py" ]]; then
            python3 -m py_compile parse_appuhdr5.py || FAILURES+=("Gate 4 (Syntax): parse_appuhdr5.py failed py_compile.")
          fi
          if [[ -f "bose-ultra-wizard.sh" ]]; then
            bash -n bose-ultra-wizard.sh || FAILURES+=("Gate 4 (Syntax): bose-ultra-wizard.sh failed bash -n.")
          fi

          if (( ${#FAILURES[@]} > 0 )); then
            BODY="### Autonomous PR Review & Gate: CHANGES REQUESTED (Commit \`${HEAD_SHA:0:7}\`)"$'\n\n'
            for f in "${FAILURES[@]}"; do
              BODY+="- ❌ ${f}"$'\n'
            done
            if [[ "${HEAD_REPO}" == "${BASE_REPO}" ]]; then
              gh pr review "${PR_NUMBER}" --request-changes --body "${BODY}" || gh pr comment "${PR_NUMBER}" --body "${BODY}"
            fi
            exit 1
          fi

          BODY="### Autonomous PR Review & Gate: APPROVED (Commit \`${HEAD_SHA:0:7}\`)"$'\n\n'
          BODY+="- ✅ **Gate 1 (OPSEC & Zero-PII)**: Clean across working tree and commit metadata."$'\n'
          BODY+="- ✅ **Gate 2 (Cryptographic Signatures)**: All PR commits have \`verified == true\`."$'\n'
          BODY+="- ✅ **Gate 3 (Legal, Autonomous Spec & Review Threads)**: \`LEGAL.md\` (with German Statutory Addendum), \`LICENSE\`, \`SECURITY.md\`, \`CODE_OF_CONDUCT.md\`, \`CODEOWNERS\`, \`AGENTS.md\`, \`CLAUDE.md\`, \`docs/agents/autonomous-pipeline.md\`, and zero unresolved \`reviewThreads\` verified."$'\n'
          BODY+="- ✅ **Gate 4 (Build & Syntax)**: Project verification checks passed."$'\n'

          if [[ "${HEAD_REPO}" == "${BASE_REPO}" && "${PR_AUTHOR}" == "TinkeringDao" ]]; then
            gh pr review "${PR_NUMBER}" --approve --body "${BODY}"
          elif [[ "${HEAD_REPO}" == "${BASE_REPO}" ]]; then
            gh pr review "${PR_NUMBER}" --comment --body "${BODY}"
          fi
